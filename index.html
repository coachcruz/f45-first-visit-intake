<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark light" />
<link rel="icon" href="data:," />
<title>First Visit Intake — F45 4S Ranch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* THEME — matches the tap-in page: dark navy by default (deep navy page,
   navy-gradient cards, cream text, red accents). The sun toggle adds
   body.light for the cream alternate. Session-only: always opens on navy. */
:root{ color-scheme: dark;
  --bg:#121a30; --surface:#1e2a4a; --card-bg:linear-gradient(180deg,#1e2a4a 0%,#1b2440 100%); --surface2:#141d36; --input-bg:rgba(0,0,0,.28);
  --ink:#f5f2ea; --muted:rgba(245,242,234,.62); --line:rgba(245,242,234,.14);
  --red:#f63746; --red-dark:#d92b38; --charcoal:#1b2440; --success:#34c06e; --success-bg:rgba(52,192,110,.16);
  --warn:#ffc46b; --error-bg:rgba(246,55,70,.16); --error-ink:#ffb3ba; --radius:14px;
  --shadow:0 18px 44px rgba(0,0,0,.35);
}
body.light{ color-scheme: light;
  --bg:#f5f2ea; --surface:#ffffff; --card-bg:#ffffff; --surface2:#ede9df; --input-bg:#ffffff;
  --ink:#1b2440; --muted:#5a6076; --line:#ddd7c8;
  --success:#0f7a4a; --success-bg:#e6f4ec;
  --warn:#8a5a00; --error-bg:#fdecee; --error-ink:#8f1622;
  --shadow:0 10px 30px rgba(27,36,64,.10);
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(47,95,195,.13), transparent 60%),
    radial-gradient(900px 500px at 50% 110%, rgba(246,55,70,.07), transparent 60%),
    repeating-linear-gradient(115deg, transparent 0 26px, rgba(27,36,64,.03) 26px 27px),
    linear-gradient(180deg, #f8f5ee 0%, #f5f2ea 100%);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;color:var(--ink);font-family:"Barlow",system-ui,sans-serif;line-height:1.45;background-color:#121a30;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(47,95,195,.20), transparent 60%),
    radial-gradient(900px 500px at 50% 110%, rgba(246,55,70,.10), transparent 60%),
    repeating-linear-gradient(115deg, transparent 0 26px, rgba(245,242,234,.022) 26px 27px),
    linear-gradient(180deg, #1b2440 0%, #121a30 100%)}
button,input{font:inherit}
.wrap{max-width:1020px;margin:0 auto;padding:20px 16px 56px}
h1,h2,h3{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.02em;line-height:.95;margin:0}
p{margin:0}
.hidden{display:none !important}

/* BRAND LOGO — official F45 Training mark, straight on the page background. */
.brand-logo{text-align:center;margin:2px 0 14px;background:transparent}
.brand-logo img{width:min(168px,44vw);height:auto;display:block;margin:0 auto;background:transparent;border:0;box-shadow:none;border-radius:0}

/* CARDS */
.section{background:var(--card-bg);border:1px solid var(--line);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}

/* STEP 1 — visit type rows */
.type-grid{display:flex;flex-direction:column;gap:6px}
.type-card{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:15px 14px;text-align:left;cursor:pointer;color:var(--ink);transition:border-color .15s, background .15s;width:100%;min-height:46px}
.type-card:hover{border-color:var(--ink)}
.type-card.selected{border-color:var(--red);background:color-mix(in srgb, var(--red) 6%, var(--surface))}
body:not(.light) .type-card{background:linear-gradient(180deg,#1e2a4a,#1b2440)}
body:not(.light) .type-card.selected{background:color-mix(in srgb, var(--red) 14%, #1e2a4a)}
.type-card .tt{flex:1;min-width:0}
.type-card b{font-family:"Barlow Condensed";text-transform:uppercase;font-size:19px;line-height:1;letter-spacing:.02em;white-space:nowrap}
.type-card .tick{flex:0 0 20px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:11px;color:transparent;margin-left:auto}
.type-card.selected .tick{background:var(--red);border-color:var(--red);color:#fff}

/* STEP 2 — form */
.capture{display:grid;grid-template-columns:128px 1fr;gap:16px}
@media(max-width:640px){.capture{grid-template-columns:1fr}}
.photo-box{text-align:center}
.avatar{width:118px;height:118px;border-radius:50%;margin:0 auto;background:var(--charcoal);color:#fff;display:grid;place-items:center;font-family:"Barlow Condensed";font-size:38px;font-weight:700;overflow:hidden;border:4px solid var(--surface);box-shadow:0 0 0 2px var(--line)}
.avatar img{width:100%;height:100%;object-fit:cover}
.photo-btn{display:block;margin-top:10px;width:100%;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px;font-weight:700;cursor:pointer;font-size:14px}
input[type=file]{display:none}
label.field{display:block;margin-top:14px}
label.field>span{display:block;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input[type=text],input[type=tel],input[type=email]{width:100%;border:1.5px solid var(--line);background:var(--input-bg);color:var(--ink);border-radius:10px;padding:12px 13px;font-size:16px}
body:not(.light) input::placeholder{color:rgba(245,242,234,.42)}
input:focus{outline:2px solid var(--red);outline-offset:1px;border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.grid2{grid-template-columns:1fr}}

.ack{display:flex;gap:12px;align-items:flex-start;background:var(--surface2);border-radius:10px;padding:14px;margin-top:14px;cursor:pointer;border:2px solid transparent;text-align:left;width:100%;color:var(--ink)}
.ack.on{border-color:var(--success)}
.ack .box{width:26px;height:26px;flex:0 0 26px;border-radius:7px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:transparent;font-weight:900}
.ack.on .box{background:var(--success);border-color:var(--success);color:#fff}
.ack b{display:block}
.error{display:none;background:var(--error-bg);color:var(--error-ink);border-radius:10px;padding:11px 13px;margin-top:12px;font-weight:600;font-size:14px}
.error.show{display:block}
.cta{width:100%;margin-top:16px;background:linear-gradient(180deg,#ff4d5c,var(--red) 55%,#c81f2e);color:#fff;border:0;border-radius:12px;padding:17px;font-family:"Barlow Condensed";text-transform:uppercase;letter-spacing:.06em;font-size:24px;font-weight:700;cursor:pointer;box-shadow:0 8px 26px rgba(246,55,70,.38), inset 0 1px 0 rgba(255,255,255,.35)}
.cta:hover{background:var(--red-dark)}
.cta:disabled{opacity:.55;cursor:not-allowed}
.back-link{display:block;margin:16px auto 0;background:none;border:0;color:var(--muted);font-size:14px;font-weight:600;cursor:pointer;padding:6px;text-decoration:underline;text-underline-offset:3px}

/* STEP 3 / FALLBACK */
.success{display:none;text-align:center;padding:34px 20px}
.success.show{display:block}
.success .big-check{width:84px;height:84px;border-radius:50%;background:var(--success);color:#fff;display:grid;place-items:center;font-size:42px;margin:0 auto 14px}
.success h2{font-size:clamp(40px,8vw,58px)}
.success h2 span{color:var(--red)}
.success .who{font-size:18px;margin-top:6px}
.fallback .big-check{background:var(--warn);color:#1b2440}
.summary-card{max-width:520px;margin:18px auto 0;text-align:left;background:var(--surface2);border-radius:12px;padding:16px}
.summary-card dl{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;margin:0;font-size:14.5px}
.summary-card dt{font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.05em;color:var(--muted);padding-top:2px}
.summary-card dd{margin:0}
.ghost-btn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer;margin-top:18px}
.footnote{color:var(--muted);font-size:13px;text-align:center;margin-top:22px}

/* THEME TOGGLE — fixed top-right, same as the tap-in page. */
.theme-toggle{position:fixed; top:calc(12px + env(safe-area-inset-top)); right:14px; z-index:60;
  width:38px; height:38px; border-radius:50%; cursor:pointer; padding:0;
  display:flex; align-items:center; justify-content:center;
  background:rgba(245,242,234,.08); border:1.5px solid var(--line); color:var(--ink);
  -webkit-appearance:none; appearance:none; touch-action:manipulation;}
.theme-toggle:active{transform:scale(.94)}
.theme-toggle svg{width:19px; height:19px; display:block;}
.theme-toggle .icon-moon{display:none;}
body.light .theme-toggle{background:#2f5fc3; border-color:var(--red); border-width:2px; color:#fff;}
body.light .theme-toggle .icon-sun{display:none;}
body.light .theme-toggle .icon-moon{display:block;}
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="Switch to cream background">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<div class="wrap">

  <div class="brand-logo"><img src="assets/f45-logo.png" alt="F45 Training logo"></div>

  <!-- STEP 1 — visit type -->
  <div id="step1">
    <div class="type-grid" role="group" aria-label="Visit type">
      <button type="button" class="type-card" data-type="trial"><span class="tt"><b>3-Day Trial</b></span><span class="tick">✓</span></button>
      <button type="button" class="type-card" data-type="classpass"><span class="tt"><b>ClassPass</b></span><span class="tick">✓</span></button>
      <button type="button" class="type-card" data-type="passport"><span class="tt"><b>Passport</b></span><span class="tick">✓</span></button>
      <button type="button" class="type-card" data-type="walkin"><span class="tt"><b>Walk-In</b></span><span class="tick">✓</span></button>
      <button type="button" class="type-card" data-type="referral"><span class="tt"><b>Referral</b></span><span class="tick">✓</span></button>
      <button type="button" class="type-card" data-type="other"><span class="tt"><b>Other</b></span><span class="tick">✓</span></button>
    </div>
  </div>

  <!-- STEP 2 — details -->
  <div id="step2" class="hidden">
    <div class="capture">
      <div class="photo-box">
        <div class="avatar" id="avatarPreview">?</div>
        <label class="photo-btn" for="photoInput">📸 Add photo</label>
        <input type="file" id="photoInput" accept="image/*" capture="user">
      </div>
      <div>
        <div class="grid2">
          <label class="field" style="margin-top:0"><span>First name *</span><input type="text" id="fFirst" placeholder="First name" autocomplete="given-name"></label>
          <label class="field" style="margin-top:0"><span>Last name *</span><input type="text" id="fLast" placeholder="Last name" autocomplete="family-name"></label>
        </div>
        <div class="grid2">
          <label class="field"><span>Age *</span><input type="text" id="fAge" inputmode="numeric" placeholder="Age"></label>
          <label class="field"><span>Phone *</span><input type="tel" id="fPhone" placeholder="(619) 555-0123" autocomplete="tel"></label>
        </div>
        <label class="field"><span>Email *</span><input type="email" id="fEmail" placeholder="you@email.com" autocomplete="email"></label>
      </div>
    </div>
    <button type="button" class="ack" id="ackWaiver">
      <span class="box">✓</span>
      <span><b>I agree to the Liability Waiver</b></span>
    </button>
    <div class="error" id="formError"></div>
    <button type="button" class="cta" id="submitBtn">Check In</button>
    <button type="button" class="back-link" id="backBtn">← Back</button>
  </div>

  <!-- STEP 3 — confirmed -->
  <section class="section success" id="stepSuccess">
    <div class="big-check">✓</div>
    <h2>You’re all set.<br><span>See your coach.</span></h2>
    <div class="summary-card"><dl>
      <dt>Name</dt><dd id="sumName"></dd>
      <dt>Visit</dt><dd id="sumVisit"></dd>
      <dt>Phone</dt><dd id="sumPhone"></dd>
    </dl></div>
    <button type="button" class="ghost-btn" id="againBtn">New check-in</button>
  </section>

  <!-- FALLBACK — save could not be confirmed; nothing is lost -->
  <section class="section success fallback" id="stepFallback">
    <div class="big-check">!</div>
    <h2>Almost there.<br><span>Show your coach.</span></h2>
    <p class="who">We couldn’t confirm your check-in — show this screen to your coach so they can check you in.</p>
    <div class="summary-card"><dl>
      <dt>Name</dt><dd id="fbName"></dd>
      <dt>Visit</dt><dd id="fbVisit"></dd>
      <dt>Phone</dt><dd id="fbPhone"></dd>
    </dl></div>
    <button type="button" class="cta" id="retryBtn" style="max-width:340px;margin-left:auto;margin-right:auto">Try again</button>
    <button type="button" class="back-link" id="fbBackBtn">← Back to my details</button>
  </section>

  <p class="footnote">F45 Training · 4S Ranch</p>

</div>

<script>
/* ============ THEME TOGGLE (session-only; page always opens on navy) ============ */
(function(){
  var btn=document.getElementById('themeToggle');
  btn.addEventListener('click', function(){
    var light=document.body.classList.toggle('light');
    btn.setAttribute('aria-pressed', light ? 'true' : 'false');
    btn.setAttribute('aria-label', light ? 'Switch to blue background' : 'Switch to cream background');
  });
})();

/* ============ STATE + FLOW ============ */
var BACKEND_URL='https://script.google.com/macros/s/AKfycbyH6ba0PBZRkHL_LiD6OAdJwz5bwu2sLb6Ko3_JZEx4KpYKnghoKLVafXQUel7eBhpl/exec';
var TYPE_LABELS={ trial:'3-Day Trial', classpass:'ClassPass', passport:'Passport', walkin:'Walk-In', referral:'Referral', other:'Other' };
var state={ type:null, typeLabel:'', photoData:null };
var $=function(id){ return document.getElementById(id); };

function goStep(n){
  $('step1').classList.toggle('hidden', n!==1);
  $('step2').classList.toggle('hidden', n!==2);
  $('stepSuccess').classList.toggle('show', n===3);
  $('stepFallback').classList.toggle('show', n===4);
  window.scrollTo({top:0, behavior:'smooth'});
}

function showError(msg){
  var e=$('formError');
  e.textContent=msg;
  e.classList.add('show');
  e.scrollIntoView({behavior:'smooth', block:'center'});
}
function hideError(){ $('formError').classList.remove('show'); }

var typeCards=document.querySelectorAll('.type-card');
for(var i=0;i<typeCards.length;i++){
  typeCards[i].addEventListener('click', function(){
    state.type=this.getAttribute('data-type');
    state.typeLabel=TYPE_LABELS[state.type];
    for(var j=0;j<typeCards.length;j++) typeCards[j].classList.remove('selected');
    this.classList.add('selected');
    hideError();
    setTimeout(function(){ goStep(2); }, 160);
  });
}

$('ackWaiver').addEventListener('click', function(){
  this.classList.toggle('on');
  hideError();
});
$('backBtn').addEventListener('click', function(){ goStep(1); });
$('fbBackBtn').addEventListener('click', function(){ goStep(2); });
$('againBtn').addEventListener('click', resetFlow);
$('submitBtn').addEventListener('click', submitVisitor);
$('retryBtn').addEventListener('click', submitVisitor);

/* ============ PHOTO — downscaled before it is ever sent ============ */
function initials(name){
  if(!name) return '?';
  var parts=name.trim().split(/\s+/);
  return (parts[0].charAt(0)+(parts.length>1 ? parts[parts.length-1].charAt(0) : '')).toUpperCase();
}
function refreshAvatar(){
  if(state.photoData) return;
  var n=($('fFirst').value+' '+$('fLast').value).trim();
  $('avatarPreview').textContent=initials(n)||'?';
}
$('fFirst').addEventListener('input', refreshAvatar);
$('fLast').addEventListener('input', refreshAvatar);

function downscalePhoto(img, fallback){
  try{
    var max=400, w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
    if(!w||!h) return fallback;
    var scale=Math.min(1, max/Math.max(w,h));
    var canvas=document.createElement('canvas');
    canvas.width=Math.max(1, Math.round(w*scale));
    canvas.height=Math.max(1, Math.round(h*scale));
    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    var q=0.78, out=canvas.toDataURL('image/jpeg', q);
    while(out.length>48000 && q>0.5){ q-=0.14; out=canvas.toDataURL('image/jpeg', q); }
    return out;
  }catch(e){ return fallback; }
}
$('photoInput').addEventListener('change', function(e){
  var file=e.target.files && e.target.files[0];
  if(!file) return;
  var reader=new FileReader();
  reader.onload=function(ev){
    var raw=ev.target.result;
    var img=new Image();
    img.onload=function(){
      state.photoData=downscalePhoto(img, raw);
      $('avatarPreview').innerHTML='<img src="'+state.photoData+'" alt="Visitor photo">';
    };
    img.onerror=function(){
      state.photoData=null;
      $('avatarPreview').innerHTML='<img src="'+raw+'" alt="Visitor photo">';
    };
    img.src=raw;
  };
  reader.readAsDataURL(file);
});

/* ============ BACKEND ============
   The save is a CORS-simple POST (no-cors + text/plain): no preflight, and
   the response is never read — Google answers a POST with a 302 redirect,
   which makes the POST response unreadable from a browser. So the POST
   itself is trusted: if it reaches Google, the check-in is in. The records
   list is NEVER downloaded to a visitor's phone — that list is the coach's,
   and it stays on the studio iPad where it belongs. */
function backendPost(payload){
  return fetch(BACKEND_URL, {
    method:'POST',
    mode:'no-cors',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  });
}


/* ============ SUBMIT ============ */
function fillSummary(prefix, p){
  $(prefix+'Name').textContent=(p.firstName+' '+p.lastName).trim();
  $(prefix+'Visit').textContent=p.visitType;
  $(prefix+'Phone').textContent=p.phone;
}

function submitVisitor(){
  var first=$('fFirst').value.trim(),
      last=$('fLast').value.trim(),
      age=$('fAge').value.trim(),
      phone=$('fPhone').value.trim(),
      email=$('fEmail').value.trim();

  if(!state.type){ goStep(1); return; }
  if(!first||!last||!age||!phone||!email){ goStep(2); showError('Please fill in your name, age, phone, and email.'); return; }
  if(email.indexOf('@')<1){ goStep(2); showError('That email doesn’t look complete — mind checking it?'); return; }
  if(!$('ackWaiver').classList.contains('on')){ goStep(2); showError('Please tap the waiver box above to check in.'); return; }

  var payload={ type:'intake', visitType:state.typeLabel, firstName:first, lastName:last,
                age:age, phone:phone, email:email, photo: state.photoData || '' };

  var btn=$('submitBtn');
  btn.disabled=true; btn.textContent='Checking in…';
  function settle(found){
    btn.disabled=false; btn.textContent='Check In';
    if(found){ fillSummary('sum', payload); goStep(3); }
    else{ fillSummary('fb', payload); goStep(4); }
  }

  /* Trust the POST: it resolving means the check-in reached Google.
     The fallback screen appears only when the fetch itself fails —
     the phone cannot reach Google at all — and then the coach checks
     the visitor in from the summary on that screen. */
  backendPost(payload).then(
    function(){ settle(true); },
    function(){ settle(false); }
  );
}

function resetFlow(){
  state.type=null; state.typeLabel=''; state.photoData=null;
  var ids=['fFirst','fLast','fAge','fPhone','fEmail'];
  for(var i=0;i<ids.length;i++) $(ids[i]).value='';
  $('photoInput').value='';
  $('avatarPreview').textContent='?';
  $('ackWaiver').classList.remove('on');
  for(var j=0;j<typeCards.length;j++) typeCards[j].classList.remove('selected');
  hideError();
  goStep(1);
}
</script>
</body>
</html>
